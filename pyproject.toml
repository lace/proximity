[tool.poetry]
name = "proximity"
version = "3.0.0a0"
description = "Mesh proximity queries based on libspatialindex and rtree, extracted from Trimesh"
authors = ["Paul Melnikow <github@paulmelnikow.com>", "Michael Dawson-Haggerty, Metabolize, Minnow Software, and other contributors"]
license = "MIT"
include = ["CHANGELOG.md", "proximity/py.typed"]
exclude = ["**/test_*.py"]
homepage = "https://proximity.readthedocs.io/en/stable/"
repository = "https://github.com/lace/proximity"
documentation = "https://proximity.readthedocs.io/en/stable/"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
numpy = "*"
polliwog = ">=3.0.0a0,<4.0.0"
rtree = "1.4.1"
scipy = "*"
vg = ">=2.0.0"
Sphinx = {version = "8.1.3", optional = true}
sphinxcontrib-apidoc = {version = "0.6.0", optional = true}
myst-parser = {version = "4.0.1", optional = true}

[tool.poetry.dev-dependencies]
black = "22.10.0"
click = "8.1.3"
coverage = "6.5.0"
executor = "23.2"
flake8 = "7.3.0"
flake8-import-order = "0.19.2"
lacecore = "3.0.0a1"
mypy = "1.19.1"
pytest = "7.2.0"
pytest-cov = "4.0.0"
twine = "4.0.2"

[tool.poetry.extras]
doc = ["Sphinx", "sphinxcontrib-apidoc", "myst-parser"]

[build-system]
# Lint requires setuptools.
requires = ["setuptools", "poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
fail_under = 100.0
omit = ["**/test_*.py", "**/vendor/*.py"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "proximity.vendor.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = 'vg.compat'
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = 'polliwog.*'
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = 'lacecore.*'
ignore_missing_imports = true
